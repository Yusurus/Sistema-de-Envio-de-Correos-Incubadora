{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <a href="{{ url_for('controladores.listar_eventos') }}" class="inline-flex items-center text-gray-500 hover:text-blue-600 text-sm font-medium transition-colors mb-4">
            <i data-lucide="arrow-left" class="h-4 w-4 mr-1"></i>
            Volver al listado
        </a>
        <h1 class="text-3xl font-bold text-gray-900">{{ 'Editar evento' if evento else 'Nuevo evento' }}</h1>
        <p class="text-gray-500 text-sm mt-1">Completa los datos básicos del evento.</p>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">
        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="nombre_evento">Nombre del evento</label>
                <input id="nombre_evento" name="nombre_evento" type="text" value="{{ evento.nombre_evento if evento else '' }}" class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="fecha_evento">Fecha del evento</label>
                <input id="fecha_evento" name="fecha_evento" type="text" value="{{ evento.fecha_evento if evento else '' }}" class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500" placeholder="Ej. 2026-05-08">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="resolucion">Resolución</label>
                <input id="resolucion" name="resolucion" type="text" value="{{ evento.resolucion if evento else '' }}" class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500" placeholder="Opcional">
            </div>

            <div class="flex items-center justify-end gap-3 pt-2">
                <a href="{{ url_for('controladores.listar_eventos') }}" class="px-4 py-2.5 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium transition-colors">Cancelar</a>
                <button type="submit" class="px-4 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium shadow-sm transition-colors">
                    {{ 'Actualizar evento' if evento else 'Crear evento' }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
