{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <a href="{{ url_for('controladores.listar_participantes') }}" class="inline-flex items-center text-gray-500 hover:text-blue-600 text-sm font-medium transition-colors mb-4">
            <i data-lucide="arrow-left" class="h-4 w-4 mr-1"></i>
            Volver al listado
        </a>
        <h1 class="text-3xl font-bold text-gray-900">{{ 'Editar participante' if participante else 'Nuevo participante' }}</h1>
        <p class="text-gray-500 text-sm mt-1">Registra o actualiza los datos del participante.</p>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">
        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="nombre_completo">Nombre del participante</label>
                <input id="nombre_completo" name="nombre_completo" type="text" value="{{ participante.nombre_completo if participante else '' }}" class="w-full px-4 py-2 rounded-lg border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all" required>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2" for="email">Email</label>
                    <input id="email" name="email" type="email" value="{{ participante.email if participante else '' }}" class="w-full px-4 py-2 rounded-lg border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2" for="telefono">Teléfono</label>
                    <input id="telefono" name="telefono" type="text" value="{{ participante.telefono if participante else '' }}" class="w-full px-4 py-2 rounded-lg border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all">
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-2">
                <a href="{{ url_for('controladores.listar_participantes') }}" class="px-4 py-2.5 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium transition-colors">Cancelar</a>
                <button type="submit" class="px-4 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium shadow-sm transition-colors">
                    {{ 'Actualizar participante' if participante else 'Crear participante' }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
